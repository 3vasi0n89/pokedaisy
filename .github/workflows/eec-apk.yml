# Builds an installable debug APK with the Emerald Extended Cut patches (eec/*.patch) on GitHub's servers.
# Run it from the Actions tab: "Build EEC APK" > Run workflow. The APK is the "pokedaisy-debug-apk" download on the run's page.
name: Build EEC APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Apply the Emerald Extended Cut patches (eec/*.patch, in name order)
        run: |
          for p in $(ls eec/*.patch | sort); do sha256sum "$p"; git apply --verbose "$p"; done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake (app/build.gradle.kts pins them)
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The new map tests first, so a broken table fails fast with a readable report.
      - name: EEC map tests
        run: ./gradlew :app:testDebugUnitTest --tests '*EecMapTest' --tests '*RegionMapModelTest' --stacktrace

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedaisy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
